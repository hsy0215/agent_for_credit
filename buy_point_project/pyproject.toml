[project]
name = "buy-point-project"
version = "0.1.0"
description = "A500 five-day random-forest training and buy-point pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "zhuokang-dev", email = "dengzhuokang@ysifund.com" },
]
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.8.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pdoc>=15.0",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
    "yapf>=0.43",
]

[tool.uv]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv.build-backend]
module-name = "buy_point_project"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["buy_point_project"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.yapf]
based_on_style = "pep8"
column_limit = 100

[tool.pytest.ini_options]
pythonpath = [".", "src"]
