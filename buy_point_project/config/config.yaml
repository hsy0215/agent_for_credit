# 默认配置复现 model.ipynb 的 10 风格 × 10 时间方案五日窗口随机森林。
input:
  factor_dir: ../output/data/factor/a500_factor
  factor_classification_path: ../output/data/db_rq_factor/因子分类.xlsx
  price_path: ../output/data/db_rq_factor/trade/1d.parquet
  event_path: ../output/data/oscillation_signals.xlsx
  # 先运行 generate_labels.py 写入该目录，之后 src/main.py 从该目录读取训练标签。
  label_path: ../output/label
  # 先运行 generate_style_manifest.py，由因子 schema 和分类表生成。
  style_manifest_path: ../output/data/a500_factor_style_manifest.csv

# 模型、预测、指标、信号和策略目录由该输出根目录派生。
output: ../output

model:
  target_column: buy_label
  test_start: 2022-04-01
  test_end: 2025-12-31
  label_lookahead_trading_days: 20
  training_dates_per_quarter: 12
  window_lags: [5, 4, 3, 2, 1]
  feature_clip_abs: 1.0e+30
  random_state: 20250818
  n_estimators: 120
  min_samples_leaf: 25
  max_features: sqrt
  styles:
    1: momentum
    2: reversal
    3: technical_state
    4: volatility_risk
    5: liquidity_turnover
    6: microstructure_orderflow
    7: valuation
    8: quality_financial_health
    9: growth_expectation
    10: correlation_size_exposure
  time_specs:
    T01: {lookback_quarters: null, half_life_quarters: null}
    T02: {lookback_quarters: null, half_life_quarters: 32}
    T03: {lookback_quarters: null, half_life_quarters: 16}
    T04: {lookback_quarters: null, half_life_quarters: 8}
    T05: {lookback_quarters: null, half_life_quarters: 4}
    T06: {lookback_quarters: 40, half_life_quarters: null}
    T07: {lookback_quarters: 28, half_life_quarters: null}
    T08: {lookback_quarters: 20, half_life_quarters: null}
    T09: {lookback_quarters: 12, half_life_quarters: null}
    T10: {lookback_quarters: 8, half_life_quarters: null}
