[project]
name = "credit-review-agent"
version = "0.1.0"
description = "Auditable credit review agent built on mcp-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "jinja2>=3.1.4",
    "mcp-agent",
    "mcp>=1.20,<2",
    "openpyxl>=3.1.5",
    "openai>=1.58.1",
    "pillow>=11.0.0",
    "pydantic>=2.10.4",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
    "temporalio>=1.10.0",
]

[project.scripts]
credit-review = "credit_review.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
mcp-agent = { path = "../mcp-agent-main", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_review"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
